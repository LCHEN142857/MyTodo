<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTodo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="top-bar">
      <div id="left-controls">
        <button id="pin-btn" class="icon-btn pin-btn" title="Pin to top">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 L12 13 M7 8 L12 13 L17 8 M9 18 L15 18"/>
          </svg>
        </button>
        <span id="history-label" class="view-label" style="display: none;">History</span>
      </div>
      <div id="right-controls">
        <button id="history-btn" class="nav-btn">History</button>
        <button id="todo-btn" class="nav-btn" style="display: none;">To Do</button>
        <button id="settings-btn" class="icon-btn settings-btn" title="Settings">S</button>
      </div>
    </div>

    <div id="search-container">
      <svg class="search-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16" y1="16" x2="21" y2="21"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search..." autocomplete="off">
    </div>

    <div id="todo-view" class="view">
      <div id="todo-list-container" class="list-container">
        <div id="todo-list" class="item-list"></div>
      </div>
    </div>

    <div id="history-view" class="view" style="display: none;">
      <div id="history-list-container" class="list-container">
        <div id="history-list" class="item-list"></div>
      </div>
    </div>

    <div id="add-container">
      <input type="text" id="todo-input" placeholder="Add a todo..." autocomplete="off">
      <button id="add-btn" title="Add">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>

    <div id="bottom-bar">
      <span id="count-label">0 To Do</span>
      <button id="clean-btn" style="display: none;">Clean histories</button>
    </div>

    <div id="settings-popup" style="display: none;">
      <div class="settings-section">
        <div class="settings-title">Opacity Setting</div>
        <div class="opacity-control">
          <input type="range" id="opacity-slider" min="0" max="100" value="92">
          <span id="opacity-value">92%</span>
        </div>
      </div>
      <button id="exit-btn" class="exit-btn">Exit</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
